## AI-Assisted

## Per-repo parameter overrides. Read at workflow runtime by the
## reusable workflows in developer-meta-files. Top-level keys
## mirror the consumer-template basename without the
## 'consumer-' prefix. Sub-keys mirror the values the reusable
## consumes.
##
## Spec:
## https://github.com/org-ai-assisted/developer-meta-files/blob/master/agents/github-actions-consumer-templates.md

coverity:
  apt-packages:    "libevdev-dev libinput-dev libwayland-dev libxkbcommon-dev pkg-config"
  build-command:   "./cov-analysis/bin/cov-build --dir cov-int make"
  ## scan.coverity.com project name. Verified at
  ## https://scan.coverity.com/projects/org-ai-assisted-kloak
  project-name:    "org-ai-assisted-kloak"
  canonical-repos: "org-ai-assisted/kloak"

cppcheck:
  paths: "src"

codeql-cpp:
  build-command: "bash build.sh"

dist-ai-tests:
  ## kloak-tests (usr/share/kloak-tests in org-ai-assisted/dist-ai) CBMC-proves
  ## and unit-tests the pure arithmetic of src/kloak.c via kloak's KLOAK_FUZZING
  ## seam. cbmc proves the invariants; gcc + the wayland/libinput/libevdev/
  ## xkbcommon dev headers + wayland-scanner (libwayland-bin) compile and link
  ## the harness exactly as kloak builds; pkg-config locates them.
  apt-packages: "python3 cbmc gcc libc6-dev libwayland-bin libwayland-dev libinput-dev libevdev-dev libxkbcommon-dev pkg-config"
